title = "Jalil's Blog"
description = "Jalil's Blog where he explains stuff he has been working on... maybe..."
# The URL the site will be built for
base_url = "https://jalil.salame.cl"
theme = "linkita"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true
# When set to "true", the generated HTML files are minified.
minify_html = false
# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true
default_language = "en"
generate_feeds = true
taxonomies = [{ name = "tags", feed = true }]

[markdown]
render_emoji = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
error_on_missing_language = true
# Whether to use inline hex colours (`inline`) or CSS classes (`class`) 
style = "inline"
light_theme = "gruvbox-light-hard"
dark_theme = "gruvbox-dark-hard"

[extra.socials.mastodon]
handle = "@teivel@mas.to"
url = "https://mas.to/@teivel"

[extra.socials.github]
handle = "GitHub@jalil-salame"
url = "https://github.com/jalil-salame"

[extra]
author = "Jalil David Salamé Messina"
username = "jalil-salame"
avatar = "images/jalil-salame_avatar.png"
keywords = ["microblog", "linux", "programming", "rust"]

# anemone
list_pages = false
display_author = true
header_nav = [
  { url = "/", name_en = "/home/" },
  { url = "/blog", name_en = "/blog/" },
  { url = "/tags", name_en = "/tags/" },
  { url = "/about", name_en = "/about" },
]

# linkita
header_menu_name = "header_nav"

[extra.menus]
header_nav = [
  { url = "@base/", name = "Home" },
  { url = "@base/blog", name = "Blog" },
  { url = "@base/tags", name = "Tags" },
  { url = "@base/about", name = "About" },
]

